# Netlify Configuration File for Flutter Web Deployment

[build]
  publish = "build/web"
  command = "flutter build web --release"

# Single Page Application (SPA) Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers for static Flutter Web assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
