# Root Netlify Configuration File

[build]
  base = "frontend"
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter && export PATH=\"$PATH:$HOME/flutter/bin\" && flutter precache --web && flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL"
  publish = "frontend/build/web"

# Single Page Application (SPA) Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers for static Flutter Web assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
