name: Release Candidate CI & Deployment Readiness

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-audit:
    name: Backend Audit & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd Backend
          npm ci || npm install

      - name: Generate Prisma Client
        run: |
          cd Backend
          npx prisma generate

      - name: Verify Node Syntax & Server Entry
        run: |
          cd Backend
          node -c src/server.js src/app.js src/utils/apiResponse.js src/middleware/requestLogger.js

  frontend-audit:
    name: Frontend Flutter Web Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd frontend
          flutter analyze

      - name: Build Flutter Web Release
        run: |
          cd frontend
          flutter build web --release --dart-define=API_BASE_URL=https://demo-api.onrender.com/api
